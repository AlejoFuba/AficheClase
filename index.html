<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiche AR</title>
    <!-- libreria aframe -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!-- libreria MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- escena de aframe -->
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- aqui van los recursos -->
            <img src="./assets/we-bare-bears.png" id="osos">
            <a-assets-item id="modelo3d" src="./assets/bear.glb"></a-assets-item>
            <video 
            id="mivideo"
            src="./assets/720video.mp4"
            preload="auto"
            loop="true"
            muted="true"
            crossorigin="anonymous"
            playsinline
            webkit-playsinline
            ></video>
        </a-assets>
        <!-- camara de la escena -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- aqui se colocan los elementos que salen en AR -->
             <!-- carga de imagen -->
            <a-plane src="#osos" position="0 0 0" width="1" height="0.5" rotation="0 0 0"></a-plane>
            <!-- modelo 3d -->
            <a-gltf-model rotation="0 0 0" position="0 0 0.1" scale="1 1 1" src="#modelo3d"></a-gltf-model>
            <!-- textos -->
            <a-text
            value="Polar"
            color="#000000"
            align="center"
            width="2"
            position="0 -0.1 0.1"
            ></a-text>
            <!-- video -->
            <a-video 
            src="#mivideo" 
            position="0 0 0.2" 
            width="1.6" 
            height="0.9"
            ></a-video>
        </a-entity>
    </a-scene>

    <script>
        document.querySelector('[mindar-image-target]').addEventListener('targetFound', () => {
            const video = document.querySelector('#mivideo');
            video.play();
        })
    </script>
</body>
</html>
